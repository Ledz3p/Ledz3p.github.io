name: PAT Expiration Reminder

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger from the Actions tab for testing

jobs:
  check-token-expiration:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Days Remaining and Notify
        env:
          # Set this to the date you generated/regenerated your token (YYYY-MM-DD)
          TOKEN_GEN_DATE: '2026-08-27'
          TOKEN_EXPIRY_DAYS: 90
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          GEN_SEC=$(date -d "$TOKEN_GEN_DATE" +%s)
          NOW_SEC=$(date +%s)
          AGE_DAYS=$(( (NOW_SEC - GEN_SEC) / 86400 ))
          DAYS_LEFT=$(( TOKEN_EXPIRY_DAYS - AGE_DAYS ))

          echo "Token age: $AGE_DAYS days. Days remaining: $DAYS_LEFT days."

          # Send notification if 5 or fewer days remain
          if [ $DAYS_LEFT -le 5 ]; then
            echo "Token expiring soon! Sending notification email..."
            
            # Format email payload using mailchannels / curl fallback
            curl -s --url 'https://api.sendgrid.com/v3/mail/send' \
              --header "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
              --header 'Content-Type: application/json' \
              --data "{
                \"personalizations\": [{\"to\": [{\"email\": \"$NOTIFICATION_EMAIL\"}]}],
                \"from\": {\"email\": \"no-reply@github-actions.local\"},
                \"subject\": \"⚠️ GitHub Token Expiring in $DAYS_LEFT Days\",
                \"content\": [{\"type\": \"text/plain\", \"value\": \"Your Yarn App GitHub Personal Access Token is expiring in $DAYS_LEFT days.\n\nRegenerate it here: https://github.com/settings/tokens\n\nThen update your token AND Gen Date in workflows in the app: https://ledz3p.github.io\"}]
              }" || echo "Notice: Set up SendGrid or use GitHub Issues fallback."
          fi
