name: PAT Expiration Reminder

on:
  schedule:
    - cron: '0 9 * * 1' # Runs every Monday
  workflow_dispatch:

jobs:
  check-token:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check Expiration and Create Issue
        env:
          TOKEN_GEN_DATE: '2026-08-27' # Update this date whenever you regenerate
          TOKEN_EXPIRY_DAYS: 90
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GEN_SEC=$(date -d "$TOKEN_GEN_DATE" +%s)
          NOW_SEC=$(date +%s)
          AGE_DAYS=$(( (NOW_SEC - GEN_SEC) / 86400 ))
          DAYS_LEFT=$(( TOKEN_EXPIRY_DAYS - AGE_DAYS ))

          echo "Token age: $AGE_DAYS days. Days remaining: $DAYS_LEFT days."

          if [ $DAYS_LEFT -le 7 ] && [ $DAYS_LEFT -gt 0 ]; then
            gh issue create \
              --title "⚠️ Action Required: Regenerate GitHub PAT ($DAYS_LEFT days left)" \
              --body "Your Yarn App Personal Access Token will expire in **$DAYS_LEFT days**.\n\n1. [Regenerate Token on GitHub](https://github.com/settings/tokens)\n2. Open [Yarn App](https://ledz3p.github.io)\n3. Click **Cloud Connected** and paste the new key.\n4. Update \`TOKEN_GEN_DATE\` in \`.github/workflows/token-reminder.yml\`."
          fi
